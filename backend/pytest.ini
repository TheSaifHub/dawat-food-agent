[pytest]
pythonpath = .
testpaths = tests
# The one "live" test fetches Supabase's public sign-in keys. Tests never touch Supabase (D-052), so it is
# deselected by default; it stays in the code only as documentation of the real endpoint's shape.
addopts = -m "not live"
markers =
    db: talks to the LOCAL test database (TEST_DATABASE_URL) inside a transaction that is always rolled back (skipped without it)
    live: calls a real external endpoint (Supabase); deselected by default, never run (D-052)
